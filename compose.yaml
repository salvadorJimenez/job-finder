# Keeps job-finder running in the background: docker compose up -d --build
# Create the folders and the config first:
#   mkdir -p config data exports && cp config.example.toml config/config.toml
# If a folder is missing, Docker creates it owned by root and the app (uid 1000) cannot write to it;
# if config/ has no config.toml, the container stops with a one-line hint (docker compose logs).
services:
  job-finder:
    build: .
    image: job-finder:latest
    container_name: job-finder
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"   # this machine only, never your network
    environment:
      TZ: ${TZ:-America/Mexico_City}   # local dates for "today" and the streak; set TZ=... to change it
    volumes:
      - ./config:/app/config:ro             # a folder, not one file: any edit shows up, read on every search
      - ./data:/app/data                    # database and CVs stay on the host
      - ./exports:/app/exports
