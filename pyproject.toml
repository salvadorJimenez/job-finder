[project]
name = "job-finder"
version = "0.1.0"
description = "Private local job search aggregator for LinkedIn, Indeed and Glassdoor"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "python-jobspy>=1.4",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "rapidfuzz>=3.0",
  "markdown-it-py>=3.0",
]

[project.urls]
Homepage = "https://github.com/salvadorJimenez/job-finder"
Issues = "https://github.com/salvadorJimenez/job-finder/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4"]
resume = ["reportlab>=4"]   # scripts/render_resume.py only; the Docker image does not need it

[project.scripts]
job-finder = "jobfinder.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobfinder*"]

[tool.setuptools.package-data]
jobfinder = ["templates/*", "static/*", "static/fonts/*", "static/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
